documentationURL: https://github.com/yamlinson/gadget-top-syscall#readme
sourceURL: https://github.com/yamlinson/gadget-top-syscall
datasources:
  calls:
    fields:
      process_id:
        annotations:
          columns.hidden: "true"
      calls:
